<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odyssey 509-1333 Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <aside class="rail left" aria-hidden="true">
      <div class="plinko">
        <div class="pegfield">
          <div class="pegset"></div>
        </div>
        <div class="ball b1"></div>
        <div class="ball b2"></div>
      </div>
    </aside>

    <main>
    <header>
      <h1>Odyssey 509-1333</h1>
      <div id="topbar">
        <p id="status">1 / 30 · Score 0</p>
        <div id="wallet">
          <span id="coins" title="Your coins">🪙 0</span>
          <button id="shop-open" type="button">🛍️ Shop</button>
        </div>
      </div>
      <div id="progress" aria-hidden="true"><div id="bar"></div></div>
      <div id="modes" role="group" aria-label="Quiz mode">
        <button id="mode-forward" class="mode active" type="button">Word → Definition</button>
        <button id="mode-reverse" class="mode" type="button">Definition → Word</button>
      </div>
    </header>

    <section id="quiz">
      <p id="term"></p>
      <p id="feedback" aria-live="polite"></p>
      <div id="options"></div>
      <div id="quiz-actions">
        <button id="submit" disabled>Submit</button>
      </div>
    </section>

    <section id="result" hidden>
      <p id="final"></p>
      <p id="grade"></p>
      <p id="best"></p>
      <div id="missed"></div>
      <div id="result-actions">
        <button id="retry-missed">Retry missed</button>
        <button id="restart">Restart</button>
      </div>
    </section>

    <footer class="watermark">
      <span>Made by</span>
      <a href="https://github.com/InSynchronous" target="_blank" rel="noopener noreferrer" aria-label="Follow me on GitHub">
        <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>InSynchronous</span>
      </a>
      <span>— have a parent that works at a f500 company? plz refer my</span>
      <a href="https://www.linkedin.com/in/ahsan-ahmed-646664371/" target="_blank" rel="noopener noreferrer" aria-label="Connect on LinkedIn">
        <svg height="14" width="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"/></svg>
        <span>linkedin</span>
      </a>
    </footer>
    </main>

    <aside class="rail right" aria-hidden="true">
      <div class="plinko">
        <div class="pegfield">
          <div class="pegset"></div>
        </div>
        <div class="ball b1"></div>
        <div class="ball b2"></div>
      </div>
    </aside>
  </div>
  <button id="motion-toggle" type="button" aria-pressed="true" title="Pause side animation">motion: on</button>
  <section id="shop" hidden>
    <div id="shop-card" role="dialog" aria-modal="true" aria-label="Shop">
      <div id="shop-head">
        <h2>🛍️ Shop</h2>
        <span id="shop-coins">🪙 0</span>
        <button id="shop-close" type="button" aria-label="Close shop">✕</button>
      </div>

      <div class="shop-item">
        <h3>🃏 Blackjack</h3>
        <p class="shop-sub">Beat the dealer to win coins · Blackjack pays 3:2</p>
        <div id="bj-table">
          <p id="bj-msg" aria-live="polite">Place a bet to start.</p>
          <div id="bj-hands">
            <div class="bj-hand">
              <span class="bj-label">Dealer <b id="bj-dealer-val"></b></span>
              <div id="bj-dealer" class="bj-cards"></div>
            </div>
            <div class="bj-hand">
              <span class="bj-label">You <b id="bj-player-val"></b></span>
              <div id="bj-player" class="bj-cards"></div>
            </div>
          </div>
          <div id="bj-bet-row">
            <span id="bj-bet-label">Bet: 🪙 <b id="bj-bet">10</b></span>
            <div id="bj-chips" role="group" aria-label="Bet amount">
              <button type="button" data-bet="10">10</button>
              <button type="button" data-bet="25">25</button>
              <button type="button" data-bet="50">50</button>
              <button type="button" data-bet="100">100</button>
              <button type="button" id="bj-max">MAX</button>
            </div>
          </div>
          <div id="bj-actions">
            <button id="bj-deal" type="button">Deal</button>
            <button id="bj-hit" type="button" disabled>Hit</button>
            <button id="bj-stand" type="button" disabled>Stand</button>
          </div>
          <button id="bj-free" type="button" hidden>Out of coins? Claim +25 free</button>
        </div>
      </div>
    </div>
  </section>
  <script src="cards.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
