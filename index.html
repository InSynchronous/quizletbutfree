<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odyssey 509-1333 Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Odyssey 509-1333</h1>
      <p id="status">1 / 30 · Score 0</p>
      <div id="modes" role="group" aria-label="Quiz mode">
        <button id="mode-forward" class="mode active" type="button">Word → Definition</button>
        <button id="mode-reverse" class="mode" type="button">Definition → Word</button>
      </div>
    </header>

    <section id="quiz">
      <p id="term"></p>
      <div id="options"></div>
      <button id="next" disabled>Next</button>
    </section>

    <section id="result" hidden>
      <p id="final"></p>
      <div id="missed"></div>
      <button id="restart">Restart</button>
    </section>
  </main>
  <script src="cards.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
